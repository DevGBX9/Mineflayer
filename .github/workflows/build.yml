name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Minecraft 26.1+ requires Java 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # No wrapper is committed: this project is built only on CI, so Gradle
      # is pinned here instead of in gradle/wrapper. 9.1+ is required to run
      # on JDK 25.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Mineflayer
          if-no-files-found: error
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
