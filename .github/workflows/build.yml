name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # No wrapper is committed: this project is built only on CI, so Gradle
      # is pinned here instead of in gradle/wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build both platforms
        run: gradle build --no-daemon --stacktrace

      - name: Upload Fabric mod
        uses: actions/upload-artifact@v4
        with:
          name: Mineflayer-Fabric
          if-no-files-found: error
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-dev.jar
            !fabric/build/libs/*-sources.jar

      - name: Upload Paper plugin
        uses: actions/upload-artifact@v4
        with:
          name: Mineflayer-Paper
          if-no-files-found: error
          path: |
            paper/build/libs/*.jar
            !paper/build/libs/*-sources.jar
