# ---------------------------------------------------------------
# Mineflayer - shared project settings
# Author: DevGBX9
# ---------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Identity (shared by both platforms)
mod_id=mineflayer
mod_name=Mineflayer
mod_version=1.0.0
mod_group=com.devgbx9
mod_author=DevGBX9
mod_description=Mineflayer

# Toolchain - Minecraft 26.1+ requires Java 25
java_version=25

# Fabric
# Compiled against 26.2; the mod itself declares support for 26.1.x - 26.2.x
# in fabric.mod.json, since it touches no version-specific Minecraft code.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.17

# Paper
# Compiled against the oldest supported line (26.1.2) so the single jar stays
# binary-compatible with both 26.1.x and 26.2.x servers.
paper_api_version=26.1.2.build.74-stable
paper_api_version_short=26.1
