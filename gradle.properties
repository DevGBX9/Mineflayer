# ---------------------------------------------------------------
# Mineflayer - shared project settings
# Author: DevGBX9
# ---------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Identity (shared by both platforms)
mod_id=mineflayer
mod_name=Mineflayer
mod_version=1.0.0
mod_group=com.devgbx9
mod_author=DevGBX9
mod_description=Mineflayer

# Toolchain - Minecraft 26.1+ requires Java 25
java_version=25

# Both platforms follow the same rule: compile against the OLDEST supported
# release (the 26.1.2 line), run on the newest. Anything that compiles is then
# guaranteed to exist on 26.2.x as well, so one jar per platform covers both
# the 26.1.x and 26.2.x series. Bumping these to a 26.2 build would silently
# allow 26.2-only API calls that crash at runtime on 26.1 servers.

# Fabric - declared support range lives in fabric.mod.json
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17.17

# Paper - declared support level lives in plugin.yml (api-version)
paper_api_version=26.1.2.build.74-stable
paper_api_version_short=26.1
