# ---------------------------------------------------------------
# Mineflayer - project settings
# Author: DevGBX9
# ---------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Identity
mod_id=mineflayer
mod_name=Mineflayer
mod_version=1.0.0
mod_group=com.devgbx9
mod_author=DevGBX9
mod_description=Mineflayer

# Toolchain
# Minecraft 26.1+ servers run on Java 25, so there is nothing to gain from
# targeting an older release: every server that can load this plugin is on 25.
java_version=25

# Built against the Spigot API rather than Paper's: Paper extends Spigot which
# extends Bukkit, so a plugin compiled here loads on Bukkit, Spigot, Paper,
# Purpur and every other fork. Compiling against paper-api would lock the
# plugin to Paper only.
#
# Pinned to the OLDEST supported release (26.1.2), so anything that compiles is
# guaranteed to exist on 26.2.x as well. One jar covers both series.
# The declared support level lives in plugin.yml (api-version).
spigot_api_version=26.1.2-R0.1-SNAPSHOT
api_version=26.1
