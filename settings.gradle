pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id 'net.fabricmc.fabric-loom' version "${loom_version}"
    }
}

rootProject.name = 'Mineflayer'

include 'common'
include 'fabric'
include 'paper'
