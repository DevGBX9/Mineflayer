# Mineflayer

# Both the fake player and the remote bot join under a freshly generated name and
# a random uuid, every time - the first join from the command and every automatic
# rejoin after it. There is no setting for this; it is how the plugin works.
#
# What that costs, so it is not a surprise: neither one owns a lasting player
# entry. Locally, every join writes a new file under world/playerdata that is
# never reused. On a remote target, no inventory, position, permission or
# whitelist entry carries over from one join to the next, and a target that keeps
# a player list accumulates names that never repeat.
#
# The one exception is a premium account, below: a token authenticates the single
# name it owns, so that bot keeps its own identity.

# Settings for the remote bot: /mineflayer m connectto <ip> <port> start
#
# The bot is a real client connection to another server. That server needs no
# plugin and is given no special treatment - it sees an ordinary player joining,
# which is exactly why nothing has to be installed on it.
remote:

  # The name the bot logs in with, used only for a premium target: it has to be
  # the name the account below actually owns, or Mojang refuses the session.
  #
  # Ignored on an offline target, where the bot generates its own name per join.
  username: Mineflayer

  # --- Offline targets (online-mode=false) ---
  #
  # Leave access-token empty. Nothing else is needed: the bot picks a new name
  # and uuid for every attempt and the target takes them at face value.

  # --- Premium targets (online-mode=true) ---
  #
  # A server with online-mode=true asks Mojang whether the login is genuine, and
  # only the account holder's own token produces a yes. So joining one needs a
  # real Microsoft account that owns the name above: fill in both fields below.
  #
  # There is no way around this. It is checked on Mojang's side, not the target
  # server's, so no setting here can stand in for it. An account you do not own
  # cannot be used - which is also why a premium bot keeps one identity across
  # joins instead of generating a new one.
  #
  # Access tokens are short-lived. When the target starts reporting that Mojang
  # refused the session, the token has expired and needs replacing.
  #
  # Treat this file as a secret once a token is in it: anyone who can read the
  # token can act as that account.
  access-token: ''

  # The profile uuid of the account above, dashed. Required with a token.
  uuid: ''

  # Echo chat and system messages from the target server into this server's
  # console. Turn off if the target is busy enough to be noisy.
  relay-chat: true
